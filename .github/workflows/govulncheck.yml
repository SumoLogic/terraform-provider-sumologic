name: govulncheck

# Report-only: lists known vulnerabilities that the provider code can reach.
# It does not fail the build, so existing findings do not block unrelated PRs.
# Read the job summary, and remove `continue-on-error` once the backlog is clear.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  pull_request:
    branches: [ master ]
    paths:
      - go.mod
      - go.sum
      - .github/workflows/govulncheck.yml

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.10.0

      - name: Run govulncheck
        continue-on-error: true
        run: |
          set -o pipefail
          govulncheck ./... | tee govulncheck.txt
          status=$?
          {
            echo '### govulncheck'
            echo '```'
            tail -n 40 govulncheck.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status
