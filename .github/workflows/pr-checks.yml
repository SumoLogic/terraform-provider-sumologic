name: PR Checks

on:
  pull_request:
    branches: [ master ]

jobs:
  changelog-check:
    name: Check CHANGELOG.md
    # Dependabot PRs get a read-only token, so the warning comment below cannot be posted.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Check for CHANGELOG.md edits and comment if missing
        run: |
          # Skip if labeled changelog/no-changelog
          LABELS=$(gh pr view ${{ github.event.pull_request.number }} --json labels --jq '.labels[].name' 2>/dev/null || echo "")
          if echo "$LABELS" | grep -q 'changelog/no-changelog'; then
            echo "Skipping — PR labeled changelog/no-changelog"
            exit 0
          fi
          if ! git diff --name-only HEAD^1 HEAD | grep -q 'CHANGELOG.md'; then
            # Only a warning: a PR from a fork has a read-only token, so do not fail the check if the comment cannot be posted.
            gh pr comment ${{ github.event.pull_request.number }} --body "⚠️ Warning: Please update CHANGELOG.md with your changes." \
              || echo "::warning::CHANGELOG.md is not updated, and a comment could not be posted."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
